# dreamer-bot: pick ONE way to expose the Mini App over HTTPS.
#
#   docker compose --profile caddy --profile duckdns up -d  # free <name>.duckdns.org domain + automatic Let's Encrypt
#   docker compose --profile caddy up -d    # your own domain pointing at this server, automatic Let's Encrypt
#   docker compose --profile tunnel up -d   # Cloudflare named tunnel (domain in Cloudflare, no open ports)
#   docker compose --profile quick up -d    # no domain: temporary trycloudflare.com URL (testing)
#   docker compose up -d                    # bot only; the Mini App is served on http://127.0.0.1:8080
#
# Tip: put the profiles into .env once (COMPOSE_PROFILES=caddy,duckdns) and
# then plain `docker compose up -d` / `logs` / `down` use them.
#
# See README.md for the full setup.

name: dreamer

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  bot:
    <<: *hardening
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: dreamer-bot:${VERSION:-latest}
    # Let in-flight saves (photo downloads) and partner notifications finish.
    stop_grace_period: 40s
    # A 40 MP progressive JPEG needs ~800 MB to decode; cap the container so
    # a big upload cannot starve the host, and let the Go GC work to a soft
    # limit below the hard one.
    mem_limit: 1g
    pids_limit: 256
    # Least privilege: pass only the bot's own settings (values come from .env),
    # so e.g. the Cloudflare tunnel token never enters this container.
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-}
      WEBAPP_URL: ${WEBAPP_URL:-}
      # Used only when WEBAPP_URL is empty: discover the quick tunnel hostname.
      QUICK_TUNNEL_METRICS_URL: ${QUICK_TUNNEL_METRICS_URL:-http://quicktunnel:20241}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-EUR}
      INITDATA_MAX_AGE: ${INITDATA_MAX_AGE:-24h}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
      DATA_DIR: /data
      HTTP_ADDR: ":8080"
      GOMEMLIMIT: 800MiB
    volumes:
      - dreamer-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      # Loopback only: reach it from this machine; the internet goes through a profile below.
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"

  caddy:
    <<: *hardening
    profiles: [caddy]
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    # Fail with a clear message instead of a Caddyfile parse error.
    command:
      - sh
      - -c
      - |
        if [ -z "$$DOMAIN" ] || [ -z "$$ACME_EMAIL" ]; then
          echo "caddy: set DOMAIN and ACME_EMAIL in .env" >&2; exit 1
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    # All capabilities are dropped; binding :80 and :443 needs this one back.
    cap_add: [NET_BIND_SERVICE]
    tmpfs:
      - /tmp:size=16m
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      bot: { condition: service_healthy }

  tunnel:
    <<: *hardening
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      bot: { condition: service_healthy }

  quicktunnel:
    <<: *hardening
    profiles: [quick]
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    # The metrics port stays inside the compose network; the bot reads
    # /quicktunnel from it to learn the random public hostname.
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:20241", "--url", "http://bot:8080"]
    depends_on:
      bot: { condition: service_healthy }

  duckdns:
    <<: *hardening
    profiles: [duckdns]
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    # Keeps a free <name>.duckdns.org domain pointed at this machine's public IP
    # (DuckDNS detects the IP itself). Use together with the caddy profile.
    # The token only ever goes to duckdns.org over HTTPS and is never printed.
    environment:
      DUCKDNS_SUBDOMAIN: ${DUCKDNS_SUBDOMAIN:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$DUCKDNS_SUBDOMAIN" ] || [ -z "$$DUCKDNS_TOKEN" ]; then
          echo "duckdns: set DUCKDNS_SUBDOMAIN and DUCKDNS_TOKEN in .env" >&2; exit 1
        fi
        while :; do
          answer=$$(curl -fsS --max-time 20 --proto '=https' \
            "https://www.duckdns.org/update?domains=$$DUCKDNS_SUBDOMAIN&token=$$DUCKDNS_TOKEN&ip=" 2>&1)
          if [ "$$answer" = "OK" ]; then
            echo "duckdns: $$DUCKDNS_SUBDOMAIN.duckdns.org points at this machine"
          else
            echo "duckdns: update failed (check the subdomain and the token)" >&2
          fi
          sleep 300
        done

volumes:
  dreamer-data:
  caddy-data:
  caddy-config:
